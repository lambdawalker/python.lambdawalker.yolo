[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-yolo"
version = "0.1.0"
description = "YOLO logging and visualization utilities for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.yolo"
Repository = "https://github.com/lambdawalker/python.lambdawalker.yolo"
Issues = "https://github.com/lambdawalker/python.lambdawalker.yolo/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.yolo"
namespace = true
